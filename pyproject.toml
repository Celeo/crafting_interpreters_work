[project]
name = "crafting-interpreters"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Celeo", email = "mattboulanger@fastmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
crafting-interpreters = "crafting_interpreters:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "A", "RUF"]
